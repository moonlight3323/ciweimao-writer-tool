<main>
 <header><small>DENIA · VOID BUBBLE</small><h1>达妮娅 · 虚无之泡</h1><p>DSH 达妮娅皮肤的作家助手适配示例</p></header>
 <section class="forms"><button id="light"><b>布景之形</b><span>粉蓝与浅紫 · 浅色</span></button><button id="dark"><b>幻灭之形</b><span>星空与虚质 · 深色</span></button></section>
 <section class="panel skin-card"><div class="panel-title"><h2>调色板</h2><select id="form"><option value="denia-light">布景之形 · 浅色设置</option><option value="denia-dark">幻灭之形 · 深色设置</option></select></div>
 <p>两种形态独立保存。更改后点击“保存并应用”。</p>
 <label class="file">自定义背景图<input id="image" type="file" accept="image/png,image/jpeg,image/webp,image/gif"></label><p id="imageName">使用主题背景</p>
 <label class="file">左上角侧栏图标<input id="icon" type="file" accept="image/png,image/jpeg,image/webp,image/gif"></label>
 <p id="iconName">使用主题图标</p><label class="default-icon"><input id="defaultIcon" type="checkbox">使用软件默认图标</label>
 <div class="sliders"><label>背景可见度 <output id="opacityValue"></output><input id="opacity" type="range" min="20" max="100" step="5"></label><label>背景模糊 <output id="blurValue"></output><input id="blur" type="range" min="0" max="16"></label><label>面板不透明度 <output id="glassValue"></output><input id="glass" type="range" min="45" max="100" step="5"></label></div>
 <div class="checks"><label><input id="leftArt" type="checkbox">左侧立绘</label><label><input id="rightArt" type="checkbox">右侧立绘</label><label><input id="chibi" type="checkbox">Q 版动态装饰</label><label><input id="bubbles" type="checkbox">漂浮泡泡</label><label><input id="trim" type="checkbox">装饰边框</label><label><input id="stars" type="checkbox">星星装饰</label></div>
 <div class="actions"><button id="save" class="primary">保存并应用</button><button id="defaults">恢复此形态默认值</button><button id="builtin">恢复软件内置主题</button></div><p id="status" role="status">正在连接作家助手…</p></section>
 <footer>原皮肤：Ewnscat · 角色原作：库洛游戏《鸣潮》<br>非官方适配示例。许可：CC BY-NC-SA 4.0，完整署名链见 LICENSE 与 NOTICE。</footer>
</main>
