<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>健康提醒</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <aside id="panel" class="panel">
    <header class="ph-head">
      <span class="ph-title">健康提醒</span>
      <button class="icon-btn" id="openSettings" title="设置">⚙</button>
    </header>

    <!-- 喝水 -->
    <div class="card">
      <div class="card-head">
        <span class="card-title">💧 喝水</span>
        <span class="card-hint" id="waterState">还有</span>
      </div>
      <div class="card-time" id="waterTime">45:00</div>
      <div class="bar"><i id="waterBar"></i></div>
      <button class="btn primary btn-sm" id="btnDrink">我喝了</button>
    </div>

    <!-- 睡觉 -->
    <div class="card">
      <div class="card-head">
        <span class="card-title">🌙 睡觉</span>
        <span class="card-hint" id="sleepHint">—</span>
      </div>
      <div class="card-time small" id="sleepTime">23:30</div>
      <div class="hint-line">到点会提示收工，每天只提醒一次</div>
    </div>

    <button class="link-btn" id="openSettings2">调整提醒间隔</button>
  </aside>

  <!-- ============ 设置面板 ============ -->
  <div id="settings" class="sheet hidden">
    <div class="sheet-card">
      <header class="sheet-head">
        <b>健康提醒设置</b>
        <button class="icon-btn" id="closeSettings">×</button>
      </header>

      <div class="sheet-body">
        <div class="field-group">
          <div class="fg-head">
            <span class="fg-title">💧 喝水提醒</span>
            <span class="fg-desc">按间隔提醒起身补水</span>
          </div>
          <div class="field">
            <label>喝水间隔（分钟）</label>
            <input type="number" id="inWater" min="10" max="240" step="5">
          </div>
        </div>

        <div class="field-group">
          <div class="fg-head">
            <span class="fg-title">🌙 睡觉提醒</span>
            <span class="fg-desc">到点提示收工</span>
          </div>
          <div class="field">
            <label>提醒时间</label>
            <input type="time" id="inSleep">
          </div>
        </div>

        <p class="tip">
          专注计时请到功能中心打开「番茄钟」—— 两个功能独立开关，互不影响。
        </p>
      </div>
    </div>
  </div>

</div>
<script src="main.js"></script>
</body>
</html>
