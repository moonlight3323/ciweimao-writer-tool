name: Check and build Windows portable

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm run check
      - run: npm test

  portable:
    needs: check
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Validate release version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:REF_TYPE -eq 'tag' -and $env:REF_NAME -ne "v$version") { throw 'Tag must match package.json version' }
      - run: npm ci --no-audit --no-fund
      - run: npm run install:electron
      - name: Verify Windows update installation
        run: node --test tests/updater-install.test.js
      - name: Build portable directory
        run: |
          $distPath = [IO.Path]::GetFullPath((Join-Path $PWD 'dist'))
          if ($distPath -ne (Join-Path $env:GITHUB_WORKSPACE 'dist')) { throw 'Unexpected build output path' }
          npm run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run pack
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run verify:portable
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Create ZIP and checksum
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $archive = "dist/ciweimao-writer-tool-v$version-windows-x64.zip"
          Compress-Archive -LiteralPath "dist/刺猬猫作家助手-v$version" -DestinationPath $archive -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $([IO.Path]::GetFileName($archive))" | Set-Content -LiteralPath "$archive.sha256" -Encoding utf8NoBOM
      - name: Create app-only ZIP for in-place update
        run: |
          # 自动更新只替换 resources\app，单独产一个只含应用代码的包（约 1 MB）。
          # 必须用 .NET 的 CreateFromDirectory 并把 includeBaseDirectory 传 $false：
          # Compress-Archive 没有这个参数，打包结果会多一层 app\ 目录，
          # 解压后覆盖到 resources\app 会变成 app\app\...
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $appSrc = Join-Path $PWD "dist/刺猬猫作家助手-v$version/resources/app"
          if (-not (Test-Path -LiteralPath $appSrc)) { throw "app directory not found: $appSrc" }
          $appArchive = "dist/ciweimao-writer-tool-v$version-app.zip"
          [IO.Compression.ZipFile]::CreateFromDirectory($appSrc, $appArchive, [IO.Compression.CompressionLevel]::Optimal, $false)
          $appHash = (Get-FileHash -LiteralPath $appArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$appHash  $([IO.Path]::GetFileName($appArchive))" | Set-Content -LiteralPath "$appArchive.sha256" -Encoding utf8NoBOM
          Write-Output "app-only: $([IO.Path]::GetFileName($appArchive)) $([math]::Round((Get-Item $appArchive).Length / 1MB, 2)) MB"
      - name: Create standalone income calculator plugin
        run: |
          $pluginVersion = (Get-Content "bundled-plugins/income-calculator/manifest.json" -Raw | ConvertFrom-Json).version
          $pluginArchive = "dist/income-calculator-v$pluginVersion.zip"
          $pluginFiles = @(
            "bundled-plugins/income-calculator/background.js",
            "bundled-plugins/income-calculator/main.js",
            "bundled-plugins/income-calculator/manifest.json",
            "bundled-plugins/income-calculator/page.html",
            "bundled-plugins/income-calculator/README.md",
            "bundled-plugins/income-calculator/style.css"
          )
          Compress-Archive -LiteralPath $pluginFiles -DestinationPath $pluginArchive -CompressionLevel Optimal
          $pluginHash = (Get-FileHash -LiteralPath $pluginArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$pluginHash  $([IO.Path]::GetFileName($pluginArchive))" | Set-Content -LiteralPath "$pluginArchive.sha256" -Encoding utf8NoBOM
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-portable
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    needs: portable
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download verified package and publish
        run: |
          set -e
          gh run download "$RUN_ID" --name windows-portable --dir release
          (cd release && sha256sum --check *.sha256)

          # 手写说明优先：docs/更新说明-<tag>.md 就是 Release 正文，格式与人读的一致。
          # 没写就回退到 GitHub 自动生成的提交列表，至少不会是空白。
          NOTES="docs/更新说明-${TAG_NAME}.md"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            # 同版本修复重发：替换成品和校验文件，随后发布新的更新清单。
            gh release upload "$TAG_NAME" release/*.zip release/*.sha256 --clobber
            if [ -f "$NOTES" ]; then
              gh release edit "$TAG_NAME" --notes-file "$NOTES" \
                --title "刺猬猫作家助手 $TAG_NAME"
            fi
          elif [ -f "$NOTES" ]; then
            echo "使用手写更新说明：$NOTES"
            gh release create "$TAG_NAME" release/*.zip release/*.sha256 \
              --verify-tag --notes-file "$NOTES" --draft \
              --title "刺猬猫作家助手 $TAG_NAME"
          else
            echo "未找到 $NOTES，回退到自动生成的变更列表"
            gh release create "$TAG_NAME" release/*.zip release/*.sha256 \
              --verify-tag --generate-notes --draft \
              --title "刺猬猫作家助手 $TAG_NAME"
          fi
          gh release edit "$TAG_NAME" --draft=false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Commit app package into repo for CDN delivery
        run: |
          # 更新包必须同时存在于仓库里，jsDelivr 才能回源分发。
          # GitHub Release 的直链会 302 到 objects.githubusercontent.com，
          # 国内连不上，用户侧表现是进度条停在 0 KB（v1.0.7 的事故）。
          set -e
          VERSION="${TAG_NAME#v}"
          mkdir -p update/assets
          # 只留当前版本，避免仓库被历史包越堆越大
          find update/assets -name 'ciweimao-writer-tool-*-app.zip' -delete
          cp "release/ciweimao-writer-tool-v${VERSION}-app.zip" update/assets/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f update/assets
          if git diff --cached --quiet; then
            echo "更新包已是仓库内最新，无需提交"
          else
            git commit -m "release: attach v${VERSION} app package for CDN delivery [skip ci]"
            git push origin HEAD:main
          fi
      - name: Publish automatic update manifest
        run: node tools/publish-update-manifest.js
